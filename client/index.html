<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="app.js" defer></script>
    <title>ChatBoi</title>
</head>

<body>
    <div class="wrapper">
        <header>
            <nav>
                <h1>ChatBot</h1>
            </nav>
        </header>

        <main>
            <section id="q_and_a">
                <article id="messages"></article>
            </section>

            <section id="message">
                <article>
                    <form id="question-form">
                        <label for="question"></label>
                        <textarea id="question" name="question" placeholder="Stil dit spørgsmål..."></textarea>
                        <button id="submit-btn" type="submit">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </form>
                </article>
                <article>
                    <button id="clear-messages-button" type="button">Ryd beskeder</button>
                    <!-- <button id="clear-stats-button" type="button">Nulstil statistik</button> -->
                </article>
            </section>

            <!-- <section id="stats">

                        <% } %>

                </article>
                <article>
                    <% if (mostAskedTopic) { %>
                    <p>Mest spurgte emne: </p>

        </main>
    </div>
</body>

</html>
